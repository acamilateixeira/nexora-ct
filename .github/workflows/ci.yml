name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade-e-testes:
    name: Testes (PHP 8.4 + MySQL 8.4)
    runs-on: ubuntu-latest

    services:
      db:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-local-secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-local-secret"
          --health-interval=5s --health-timeout=5s --health-retries=30

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Cache do Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock', 'composer.json') }}

      - name: Dependências
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Bancos e usuários
        run: |
          mysql -h 127.0.0.1 -uroot -proot-local-secret -e "SET GLOBAL log_bin_trust_function_creators = 1"
          mysql -h 127.0.0.1 -uroot -proot-local-secret < docker/mysql/init/01-databases-and-users.sql

      - name: Ambiente de teste
        run: sed 's/^DB_HOST=db/DB_HOST=127.0.0.1/' .env.testing.example > .env.testing

      - name: Avisos de segurança
        run: composer audit --locked

      - name: Estilo (PSR-12)
        run: composer lint

      - name: Análise estática (Larastan)
        run: composer stan

      - name: Testes
        run: php artisan test

  imagem:
    name: Imagem prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ambiente-docker:
    name: make up + make test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: make up
        run: make up

      - name: Aplicação responde
        run: |
          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8080/ready

      - name: make test
        run: make test

      - name: make check-grants
        run: make check-grants

      - name: Logs
        if: failure()
        run: docker compose logs --no-color
